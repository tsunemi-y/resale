<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>プリンセスたしざんランド</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#ffd9ec;
    --bg2:#dcd2ff;
    --bg3:#c9ecff;
    --card:#fffaff;
    --ink:#7a4a76;
    --ink-soft:#a97ea3;
    --gold:#f4c14e;
    --pink-deep:#ff6fa5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:'Kiwi Maru','Baloo 2',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  body{
    background:
      radial-gradient(circle at 15% 20%, #fff 0%, transparent 2%),
      radial-gradient(circle at 80% 10%, #fff 0%, transparent 2%),
      radial-gradient(circle at 60% 70%, #fff 0%, transparent 2%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    min-height:100vh;
    position:relative;
  }

  /* ===== 背景のきらきら ===== */
  .sparkles{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;
  }
  .sparkles span{
    position:absolute;
    font-size:20px;
    opacity:.55;
    animation:float 9s linear infinite;
    filter:drop-shadow(0 0 4px #fff);
  }
  @keyframes float{
    0%{transform:translateY(110vh) rotate(0deg) scale(.7); opacity:0;}
    10%{opacity:.7;}
    90%{opacity:.6;}
    100%{transform:translateY(-10vh) rotate(360deg) scale(1.1); opacity:0;}
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:18px 14px 60px;
  }

  header{
    text-align:center;
    margin-bottom:10px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(20px,6.4vw,34px);
    margin:6px 0 2px;
    color:var(--pink-deep);
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 0 3px 8px rgba(255,111,165,.35);
    letter-spacing:.5px;
    word-break:keep-all;
    white-space:nowrap;
  }
  header .sub{
    font-size:14px;
    color:var(--ink-soft);
  }

  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:14px 0;
  }

  .mascot-box{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .mascot{
    font-size:46px;
    display:inline-block;
    animation:bob 2.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.15));
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-6px) rotate(2deg);}
  }
  .mascot.happy{animation:happyjump .5s ease;}
  @keyframes happyjump{
    0%{transform:translateY(0) scale(1);}
    30%{transform:translateY(-22px) scale(1.15) rotate(-8deg);}
    60%{transform:translateY(-4px) scale(1.05) rotate(6deg);}
    100%{transform:translateY(0) scale(1);}
  }
  .mascot.oops{animation:oopsshake .5s ease;}
  @keyframes oopsshake{
    0%,100%{transform:translateX(0) rotate(0);}
    25%{transform:translateX(-6px) rotate(-6deg);}
    75%{transform:translateX(6px) rotate(6deg);}
  }

  .streak-gauge{
    display:flex;
    gap:6px;
    background:#fff;
    padding:8px 12px;
    border-radius:20px;
    box-shadow:0 3px 0 #f0d9ea, 0 6px 14px rgba(150,90,150,.15);
  }
  .streak-gauge .heart{
    font-size:22px;
    opacity:.25;
    transition:transform .25s ease, opacity .25s ease;
  }
  .streak-gauge .heart.on{
    opacity:1;
    transform:scale(1.2);
  }

  .sound-btn{
    border:none;
    background:#fff;
    width:44px;height:44px;
    border-radius:50%;
    font-size:20px;
    box-shadow:0 3px 0 #f0d9ea, 0 6px 14px rgba(150,90,150,.15);
    cursor:pointer;
  }

  /* ===== 問題カード ===== */
  .problem-card{
    background:var(--card);
    border-radius:28px;
    padding:22px 16px 26px;
    box-shadow:0 6px 0 #f0d3ea, 0 14px 30px rgba(150,90,150,.2);
    position:relative;
    overflow:hidden;
  }
  .problem-card::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,220,240,.9), transparent 70%);
  }

  .equation{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .num-chip{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:10px 12px 12px;
    border-radius:20px;
    min-width:96px;
  }
  .princess-badge{
    width:48px;
    height:48px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));
  }
  .pname{
    font-family:'Kiwi Maru',sans-serif;
    font-size:11px;
    font-weight:500;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.2);
    white-space:nowrap;
  }
  .num-chip .digit{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:36px;
    line-height:1;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .num-chip .dots{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .num-chip .dot-row{
    display:flex;
    justify-content:center;
    gap:4px;
  }
  .num-chip .dots i{
    width:9px;height:9px;border-radius:50%;
    background:rgba(255,255,255,.85);
    display:inline-block;
    box-shadow:0 1px 1px rgba(0,0,0,.15) inset;
  }
  .op{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:34px;
    color:var(--ink-soft);
  }
  .q-chip{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:88px;
    min-height:96px;
    border-radius:20px;
    background:repeating-linear-gradient(135deg,#f6e3f6,#f6e3f6 10px,#f0d6f2 10px,#f0d6f2 20px);
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:44px;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
    transition:background .2s ease;
  }
  .q-chip .qdigit{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:44px;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .q-chip.q-pop{ animation:qPop .35s ease; }
  .q-chip.q-correct{ animation:qCorrectPulse .6s ease; box-shadow:0 0 0 5px #ffe066 inset; }
  .q-chip.q-wrong{ animation:qShake .5s ease; }
  .q-chip.q-reveal{ box-shadow:0 0 0 4px rgba(255,224,102,.9) inset; }
  @keyframes qPop{
    0%{transform:scale(.4); opacity:0;}
    65%{transform:scale(1.18); opacity:1;}
    100%{transform:scale(1);}
  }
  @keyframes qCorrectPulse{
    0%{transform:scale(1);}
    45%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }
  @keyframes qShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-7px);}
    75%{transform:translateX(7px);}
  }

  .choices{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .choice-btn{
    border:none;
    cursor:pointer;
    border-radius:22px;
    padding:10px 10px 12px;
    min-width:96px;
    min-height:130px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:34px;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
    box-shadow:0 5px 0 rgba(0,0,0,.13), 0 10px 18px rgba(150,90,150,.18);
    transition:transform .12s ease;
  }
  .choice-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.13);}
  .choice-btn .label{
    font-family:'Kiwi Maru',sans-serif;
    font-size:12px;
    font-weight:500;
    color:rgba(255,255,255,.95);
  }
  .choice-btn.correct-flash{outline:5px solid #ffe066; animation:pulse .5s ease;}
  .choice-btn.wrong-flash{filter:grayscale(.4) brightness(.85);}
  @keyframes pulse{
    0%{transform:scale(1);}
    40%{transform:scale(1.12);}
    100%{transform:scale(1);}
  }

  .feedback{
    text-align:center;
    min-height:30px;
    margin-top:14px;
    font-size:18px;
    font-weight:500;
  }
  .feedback.good{color:#e0862a;}
  .feedback.bad{color:#ff6fa5;}

  /* ===== きせかえコーナー ===== */
  .dressup{
    margin-top:22px;
    background:#fff;
    border-radius:24px;
    padding:16px;
    box-shadow:0 5px 0 #f0d9ea, 0 10px 20px rgba(150,90,150,.15);
  }
  .dressup h2{
    margin:2px 0 12px;
    font-size:16px;
    text-align:center;
    color:var(--pink-deep);
  }
  .avatar-stage{
    position:relative;
    width:min(280px, 78vw);
    aspect-ratio:240/380;
    margin:0 auto;
    background:
      radial-gradient(ellipse at 50% 28%, rgba(255,255,255,.9), transparent 55%),
      linear-gradient(160deg, #fdeef8, #f3e6fb 55%, #eaf3ff);
    border-radius:20px;
    overflow:hidden;
  }
  .avatar-stage::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(2px 2px at 15% 15%, #fff, transparent),
      radial-gradient(2px 2px at 85% 20%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 75% 8%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 25% 85%, #fff, transparent),
      radial-gradient(2px 2px at 90% 70%, #fff, transparent);
    opacity:.8;
    pointer-events:none;
  }
  .avatar-doll{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .avatar-slot{
    position:absolute;
    width:13%;
    aspect-ratio:1;
    max-width:36px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.7);
    border:2px dashed #e3b8d8;
    cursor:pointer;
    transition:transform .15s ease;
    z-index:2;
  }
  .avatar-slot svg{width:100%;height:100%;}
  .avatar-slot.filled{
    border-style:solid;
    border-color:#ffe066;
    background:#fff;
    box-shadow:0 3px 8px rgba(150,90,150,.3), 0 0 0 3px rgba(255,224,102,.35);
  }
  .avatar-slot:active{transform:translate(-50%,-50%) scale(.9);}
  .dressup-hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:12px;
  }

  /* ===== コレクション ===== */
  .collection{
    margin-top:22px;
    background:#fff;
    border-radius:24px;
    padding:16px;
    box-shadow:0 5px 0 #f0d9ea, 0 10px 20px rgba(150,90,150,.15);
  }
  .collection h2{
    margin:2px 0 10px;
    font-size:16px;
    text-align:center;
    color:var(--pink-deep);
  }
  .collection .count{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .item-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(64px,1fr));
    gap:10px;
  }
  .item-slot{
    position:relative;
    aspect-ratio:1;
    border-radius:16px;
    background:linear-gradient(160deg,#fbeaf7,#f2e3ff);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .item-slot{cursor:pointer;}
  .item-slot svg{width:70%;height:70%;}
  .item-slot.equipped{
    outline:3px solid #ffe066;
    outline-offset:-3px;
    background:linear-gradient(160deg,#fff3d9,#ffe9f5);
  }
  .item-slot .wornmark{
    position:absolute; top:2px; left:4px;
    font-size:11px;
  }
  .item-slot .badge{
    position:absolute; bottom:2px; right:4px;
    font-size:10px; background:var(--pink-deep); color:#fff;
    border-radius:8px; padding:0 5px; font-weight:700;
  }
  .empty-hint{
    grid-column:1/-1;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    padding:18px 10px;
  }

  /* ===== プリンセス図鑑 ===== */
  .legend{
    margin-top:16px;
    background:#fff;
    border-radius:24px;
    padding:16px;
    box-shadow:0 5px 0 #f0d9ea, 0 10px 20px rgba(150,90,150,.15);
  }
  .legend h2{
    margin:2px 0 12px;
    font-size:16px;
    text-align:center;
    color:var(--pink-deep);
  }
  .legend-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
    gap:10px;
  }
  .legend-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 4px;
    border-radius:16px;
  }
  .legend-item .princess-badge{
    width:38px;
    height:38px;
  }
  .legend-item .ldigit{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:18px;
    color:#fff;
    text-shadow:0 1px 0 rgba(0,0,0,.12);
  }
  .legend-item .lname{
    font-size:10px;
    font-weight:500;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.15);
    text-align:center;
    line-height:1.2;
  }

  /* ===== ごほうびモーダル ===== */
  .modal-back{
    position:fixed; inset:0; background:rgba(120,70,110,.45);
    display:flex; align-items:center; justify-content:center;
    z-index:20; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .modal-back.show{opacity:1; pointer-events:auto;}
  .modal{
    background:#fffaff;
    border-radius:28px;
    padding:26px 22px 22px;
    max-width:320px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(80,30,70,.35);
    transform:scale(.7);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-back.show .modal{transform:scale(1);}
  .modal h3{
    color:var(--pink-deep);
    font-size:20px;
    margin:4px 0 14px;
  }
  .modal .item-icon{
    width:120px;height:120px;
    margin:0 auto 12px;
    animation:spinin .6s ease;
  }
  @keyframes spinin{
    0%{transform:scale(.3) rotate(-30deg); opacity:0;}
    100%{transform:scale(1) rotate(0); opacity:1;}
  }
  .modal .item-name{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:16px;
  }
  .modal button{
    border:none;
    background:linear-gradient(135deg,#ff9ecb,#ff6fa5);
    color:#fff;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:12px 28px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 4px 0 #d9457e;
  }
  .modal button:active{transform:translateY(3px); box-shadow:0 1px 0 #d9457e;}

  /* 紙吹雪 */
  .confetti-piece{
    position:fixed;
    top:-10px;
    z-index:30;
    pointer-events:none;
    border-radius:2px;
    animation:fall 2.4s linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(540deg); opacity:.2;}
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:26px;
  }
</style>
</head>
<body>

<div class="sparkles" id="sparkles"></div>

<div class="wrap">
  <header>
    <h1>👑 プリンセスたしざんランド 👑</h1>
    <div class="sub">かずをたしてドレスアップ・アイテムをあつめよう！</div>
  </header>

  <div class="top-row">
    <div class="mascot-box">
      <span class="mascot" id="mascot">👸</span>
      <div class="streak-gauge" id="streakGauge">
        <span class="heart">💗</span>
        <span class="heart">💗</span>
        <span class="heart">💗</span>
      </div>
    </div>
    <button class="sound-btn" id="soundBtn" title="おと ON/OFF">🔊</button>
  </div>

  <div class="problem-card">
    <div class="equation" id="equation"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="dressup">
    <h2>👗 きせかえコーナー 👗</h2>
    <div class="avatar-stage">
      <svg class="avatar-doll" viewBox="0 0 240 380">
        <defs>
          <radialGradient id="dollSkin" cx="35%" cy="28%" r="80%">
            <stop offset="0%" stop-color="#fff2e2"/>
            <stop offset="100%" stop-color="#ffdcb6"/>
          </radialGradient>
          <linearGradient id="dollHair" x1="10%" y1="0%" x2="90%" y2="100%">
            <stop offset="0%" stop-color="#d29a5c"/>
            <stop offset="55%" stop-color="#af7736"/>
            <stop offset="100%" stop-color="#8f5b24"/>
          </linearGradient>
          <linearGradient id="dollDress" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#fff2f8"/>
            <stop offset="45%" stop-color="#ffd3e9"/>
            <stop offset="100%" stop-color="#ff9fcc"/>
          </linearGradient>
          <radialGradient id="dollCheek" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff93ab" stop-opacity=".6"/>
            <stop offset="100%" stop-color="#ff93ab" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <ellipse cx="120" cy="365" rx="52" ry="9" fill="rgba(120,70,110,.16)"/>

        <path d="M52,98 Q36,36 120,24 Q204,36 188,98
                 Q206,150 196,235 Q178,195 168,145 Q160,110 120,98
                 Q80,110 72,145 Q62,195 44,235 Q34,150 52,98 Z" fill="url(#dollHair)"/>

        <rect x="99" y="334" width="17" height="34" rx="8" fill="url(#dollSkin)"/>
        <rect x="124" y="334" width="17" height="34" rx="8" fill="url(#dollSkin)"/>
        <ellipse cx="107" cy="369" rx="15" ry="7" fill="#fff0f7" stroke="#ff9fcc" stroke-width="2"/>
        <ellipse cx="133" cy="369" rx="15" ry="7" fill="#fff0f7" stroke="#ff9fcc" stroke-width="2"/>

        <path d="M80,160 Q52,182 47,224 Q46,236 57,239 Q68,236 65,223 Q69,186 96,168 Z" fill="url(#dollSkin)"/>
        <path d="M160,160 Q188,182 193,224 Q194,236 183,239 Q172,236 175,223 Q171,186 144,168 Z" fill="url(#dollSkin)"/>

        <path d="M92,205 Q120,190 148,205 L184,312
                 Q174,326 162,312 Q154,326 142,312 Q134,326 122,312
                 Q114,326 106,312 Q98,326 86,312 Q78,326 66,312
                 Q58,326 48,312 Z" fill="url(#dollDress)"/>
        <path d="M120,205 L112,314" stroke="#ffbcdc" stroke-width="2.5" opacity=".55" fill="none"/>
        <path d="M120,205 L129,314" stroke="#ffbcdc" stroke-width="2.5" opacity=".55" fill="none"/>
        <path d="M104,207 L84,300" stroke="#ffcfe6" stroke-width="2" opacity=".45" fill="none"/>
        <path d="M136,207 L157,300" stroke="#ffcfe6" stroke-width="2" opacity=".45" fill="none"/>

        <path d="M80,150 Q120,138 160,150 L150,208 Q120,197 90,208 Z" fill="url(#dollDress)"/>
        <path d="M100,151 Q120,165 140,151" stroke="#fff" stroke-width="3" fill="none" opacity=".85"/>

        <rect x="107" y="126" width="26" height="28" rx="9" fill="url(#dollSkin)"/>

        <ellipse cx="120" cy="88" rx="47" ry="51" fill="url(#dollSkin)"/>
        <ellipse cx="71" cy="92" rx="6" ry="9" fill="url(#dollSkin)"/>
        <ellipse cx="169" cy="92" rx="6" ry="9" fill="url(#dollSkin)"/>

        <ellipse cx="89" cy="103" rx="15" ry="10" fill="url(#dollCheek)"/>
        <ellipse cx="151" cy="103" rx="15" ry="10" fill="url(#dollCheek)"/>

        <path d="M90,67 Q100,60 111,65" stroke="#7a5230" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M129,65 Q140,60 150,67" stroke="#7a5230" stroke-width="2.6" fill="none" stroke-linecap="round"/>

        <g transform="translate(100,85)">

    <circle cx="50" cy="56" r="27" fill="#ffe0c2"/>
    <circle cx="41" cy="57" r="2.8" fill="#5a3d3d"/><circle cx="59" cy="57" r="2.8" fill="#5a3d3d"/>
    <circle cx="34" cy="64" r="4.2" fill="#ffb3c6" opacity=".55"/><circle cx="66" cy="64" r="4.2" fill="#ffb3c6" opacity=".55"/>
    <path d="M43,66 Q50,71 57,66" stroke="#a35d5d" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M37,25 L41,14 L50,23 L59,14 L63,25 Z" fill="#f4c14e" stroke="#e0a92e" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="50" cy="19" r="2.2" fill="#fff"/>
    <circle cx="79" cy="79" r="17" fill="#fff" stroke="#b37bff" stroke-width="3"/>
    <g transform="translate(79,84)" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M-11,0 A11,11 0 0 1 11,0" stroke="#ff6b7a"/>
      <path d="M-8,0 A8,8 0 0 1 8,0" stroke="#ffd23d"/>
      <path d="M-5,0 A5,5 0 0 1 5,0" stroke="#4da6ff"/>
    </g>
  </symbol>
</svg>

<script>
(function(){
  "use strict";

  /* ---------- 数字と色の対応表 ---------- */
  const NUM_COLORS = {
    1:{name:"あか",    hex:"#ff6b7a"},
    2:{name:"あお",    hex:"#4da6ff"},
    3:{name:"オレンジ", hex:"#ffa13d"},
    4:{name:"むらさき", hex:"#b37bff"},
    5:{name:"ピンク",  hex:"#ff7fc4"},
    6:{name:"きいろ",  hex:"#ffd23d"},
    7:{name:"みどり",  hex:"#57c98a"},
    8:{name:"みずいろ", hex:"#4dd9e8"},
    9:{name:"きんいろ", hex:"#caa23d"},
    10:{name:"にじいろ", hex:"linear-gradient(135deg,#ff6b7a,#ffd23d,#57c98a,#4da6ff,#b37bff)"}
  };

  function chipBg(n){
    const c = NUM_COLORS[n];
    return c.hex.startsWith("linear") ? c.hex : c.hex;
  }

  /* ---------- 数字とプリンセスの対応表 ---------- */
  const PRINCESSES = {
    1:{name:"白雪姫",     icon:"pr-1"},
    2:{name:"人魚姫",     icon:"pr-2"},
    3:{name:"シンデレラ",  icon:"pr-3"},
    4:{name:"いばら姫",   icon:"pr-4"},
    5:{name:"さくら姫",   icon:"pr-5"},
    6:{name:"ラプンツェル", icon:"pr-6"},
    7:{name:"かぐや姫",   icon:"pr-7"},
    8:{name:"こおりの姫", icon:"pr-8"},
    9:{name:"ほしの姫",   icon:"pr-9"},
    10:{name:"にじいろ姫", icon:"pr-10"}
  };

  /* ---------- ごほうびアイテム（10しゅるいの宝石 × 10しゅるいの形 = 100アイテム） ---------- */
  const GEMS = [
    {id:"ruby",       name:"ルビー",       hex:"#ff6b7a"},
    {id:"sapphire",   name:"サファイア",   hex:"#4da6ff"},
    {id:"amber",      name:"アンバー",     hex:"#ffa13d"},
    {id:"amethyst",   name:"アメジスト",   hex:"#b37bff"},
    {id:"rosequartz", name:"ローズクォーツ", hex:"#ff7fc4"},
    {id:"citrine",    name:"シトリン",     hex:"#ffd23d"},
    {id:"emerald",    name:"エメラルド",   hex:"#57c98a"},
    {id:"aqua",       name:"アクアマリン", hex:"#4dd9e8"},
    {id:"gold",       name:"ゴールド",     hex:"#caa23d"},
    {id:"rainbow",    name:"レインボー",   hex:null}
  ];

  const SHAPES = [
    {id:"necklace", name:"ネックレス", svg:c=>`
      <path d="M20,22 Q50,68 80,22" fill="none" stroke="#f4c14e" stroke-width="6" stroke-linecap="round"/>
      <circle cx="20" cy="22" r="5" fill="#f4c14e"/><circle cx="80" cy="22" r="5" fill="#f4c14e"/>
      <polygon points="50,58 62,72 50,88 38,72" fill="${c}" stroke="rgba(0,0,0,.22)" stroke-width="2"/>
      <polygon points="50,58 62,72 50,72" fill="#fff" opacity=".5"/>`},
    {id:"ring", name:"ゆびわ", svg:c=>`
      <circle cx="50" cy="62" r="24" fill="none" stroke="#f4c14e" stroke-width="9"/>
      <polygon points="50,20 62,36 50,48 38,36" fill="${c}" stroke="rgba(0,0,0,.22)" stroke-width="2"/>
      <polygon points="50,20 62,36 50,36" fill="#fff" opacity=".5"/>`},
    {id:"tiara", name:"ティアラ", svg:c=>`
      <path d="M15,70 L15,55 L32,68 L50,30 L68,68 L85,55 L85,70 Z" fill="#f4c14e" stroke="#e0a92e" stroke-width="2"/>
      <circle cx="50" cy="32" r="7" fill="${c}"/><circle cx="27" cy="60" r="5" fill="${c}" opacity=".85"/>
      <circle cx="73" cy="60" r="5" fill="${c}" opacity=".85"/><rect x="14" y="70" width="72" height="8" rx="3" fill="#f4c14e"/>`},
    {id:"wand", name:"まほうのつえ", svg:c=>`
      <line x1="25" y1="85" x2="65" y2="45" stroke="#e0a92e" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(70,32)"><polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="2"/></g>
      <circle cx="30" cy="80" r="3" fill="${c}"/>`},
    {id:"ribbon", name:"リボン", svg:c=>`
      <polygon points="50,50 15,25 15,75" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="2"/>
      <polygon points="50,50 85,25 85,75" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="2"/>
      <circle cx="50" cy="50" r="9" fill="#fff8ec" stroke="rgba(0,0,0,.2)" stroke-width="2"/>`},
    {id:"shoes", name:"くつ", svg:c=>`
      <path d="M22,74 L22,46 Q22,40 29,40 Q40,40 47,45 Q66,58 86,63 Q93,65 91,72 Q89,78 80,78 L26,78 Q22,78 22,74 Z" fill="${c}" stroke="rgba(0,0,0,.25)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M22,70 L91,70 Q92,78 82,79 L26,79 Q21,79 22,70 Z" fill="#fff" opacity=".65"/>
      <circle cx="42" cy="49" r="4" fill="#fff"/><circle cx="42" cy="49" r="4" fill="none" stroke="${c}" stroke-width="1.5"/>`},
    {id:"earrings", name:"イヤリング", svg:c=>`
      <g transform="translate(30,28)"><circle cx="0" cy="0" r="4" fill="#f4c14e"/><line x1="0" y1="4" x2="0" y2="14" stroke="#f4c14e" stroke-width="2"/>
      <polygon points="0,14 7,27 0,38 -7,27" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/></g>
      <g transform="translate(70,28)"><circle cx="0" cy="0" r="4" fill="#f4c14e"/><line x1="0" y1="4" x2="0" y2="14" stroke="#f4c14e" stroke-width="2"/>
      <polygon points="0,14 7,27 0,38 -7,27" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/></g>`},
    {id:"bracelet", name:"ブレスレット", svg:c=>`
      <ellipse cx="50" cy="55" rx="32" ry="20" fill="none" stroke="#f4c14e" stroke-width="7"/>
      <circle cx="50" cy="35" r="6" fill="${c}"/><circle cx="22" cy="58" r="5" fill="${c}" opacity=".85"/><circle cx="78" cy="58" r="5" fill="${c}" opacity=".85"/>`},
    {id:"brooch", name:"ブローチ", svg:c=>`
      <g fill="${c}"><ellipse cx="50" cy="30" rx="8" ry="12"/><ellipse cx="50" cy="70" rx="8" ry="12"/><ellipse cx="30" cy="50" rx="12" ry="8"/><ellipse cx="70" cy="50" rx="12" ry="8"/></g>
      <circle cx="50" cy="50" r="10" fill="#f4c14e" stroke="#e0a92e" stroke-width="2"/>`},
    {id:"hairclip", name:"ヘアクリップ", svg:c=>`
      <rect x="18" y="46" width="64" height="10" rx="5" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/>
      <circle cx="50" cy="51" r="9" fill="#fff8ec" stroke="rgba(0,0,0,.15)" stroke-width="1.5"/><circle cx="50" cy="51" r="4" fill="${c}"/>`}
  ];

  const RAINBOW_STOPS = `<stop offset="0" stop-color="#ff6b7a"/><stop offset=".25" stop-color="#ffd23d"/><stop offset=".5" stop-color="#57c98a"/><stop offset=".75" stop-color="#4da6ff"/><stop offset="1" stop-color="#b37bff"/>`;

  const ITEMS = [];
  GEMS.forEach(g=>{
    SHAPES.forEach(s=>{
      ITEMS.push({id:`${g.id}-${s.id}`, name:`${g.name}の${s.name}`, gem:g.id, shape:s.id});
    });
  });

  function itemIconInner(item){
    const gem = GEMS.find(g=>g.id===item.gem);
    const shape = SHAPES.find(s=>s.id===item.shape);
    let fill = gem.hex, defs = "";
    if(gem.id === "rainbow"){
      const gid = `rg-${item.id}`;
      defs = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">${RAINBOW_STOPS}</linearGradient></defs>`;
      fill = `url(#${gid})`;
    }
    return defs + shape.svg(fill);
  }

  /* ---------- 状態管理 ---------- */
  const SAVE_KEY = "princess-math-game-v1";
  let state = loadState();

  function loadState(){
    let s = null;
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(raw) s = JSON.parse(raw);
    }catch(e){}
    if(!s) s = {};
    if(!Array.isArray(s.collected)) s.collected = [];
    if(typeof s.streak !== "number") s.streak = 0;
    if(typeof s.muted !== "boolean") s.muted = false;
    if(!s.equipped || typeof s.equipped !== "object") s.equipped = {};
    return s;
  }
  function saveState(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
  }

  /* ---------- サウンド ---------- */
  let audioCtx = null;
  function beep(freqs, dur){
    if(state.muted) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      freqs.forEach((f,i)=>{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, now + i*0.12);
        gain.gain.linearRampToValueAtTime(0.18, now + i*0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.12 + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + i*0.12);
        osc.stop(now + i*0.12 + dur + 0.05);
      });
    }catch(e){}
  }
  function playCorrect(){ beep([523.25,659.25,783.99], 0.35); }
  function playWrong(){ beep([300,220], 0.3); }
  function playReward(){ beep([659.25,783.99,987.77,1174.66], 0.45); }

  /* ---------- 背景のきらきら生成 ---------- */
  (function makeSparkles(){
    const el = document.getElementById("sparkles");
    const glyphs = ["✨","⭐","💗","🌸","👑"];
    for(let i=0;i<16;i++){
      const s = document.createElement("span");
      s.textContent = glyphs[i % glyphs.length];
      s.style.left = Math.random()*100 + "vw";
      s.style.animationDelay = (Math.random()*9) + "s";
      s.style.animationDuration = (7+Math.random()*6) + "s";
      s.style.fontSize = (14+Math.random()*16) + "px";
      el.appendChild(s);
    }
  })();

  /* ---------- 問題生成 ---------- */
  let current = null;

  function maxAddendForLevel(){
    // コレクションが増えるほど少しずつ数字の範囲が広がる
    return Math.min(6, 2 + Math.floor(state.collected.length/2));
  }

  function genProblem(){
    const maxA = maxAddendForLevel();
    let a,b,sum;
    do{
      a = 1 + Math.floor(Math.random()*maxA);
      b = 1 + Math.floor(Math.random()*maxA);
      sum = a+b;
    }while(sum>10);

    const choices = new Set([sum]);
    while(choices.size < 3){
      const delta = [-2,-1,1,2][Math.floor(Math.random()*4)];
      const cand = sum + delta;
      if(cand>=1 && cand<=10) choices.add(cand);
    }
    const choiceArr = shuffle(Array.from(choices));
    current = {a,b,sum,choiceArr};
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function dotsHtml(n){
    let h = "";
    for(let i=0; i<n; i+=5){
      const count = Math.min(5, n-i);
      h += `<div class="dot-row">${"<i></i>".repeat(count)}</div>`;
    }
    return h;
  }

  function numChipHtml(n){
    const p = PRINCESSES[n];
    return `
      <div class="num-chip" style="background:${chipBg(n)}">
        <svg class="princess-badge"><use href="#${p.icon}"></use></svg>
        <div class="digit">${n}</div>
        <div class="dots">${dotsHtml(n)}</div>
        <div class="pname">${p.name}</div>
      </div>
    `;
  }

  function renderProblem(){
    const eq = document.getElementById("equation");
    const {a,b} = current;
    eq.innerHTML = `
      ${numChipHtml(a)}
      <div class="op">＋</div>
      ${numChipHtml(b)}
      <div class="op">＝</div>
      <div class="q-chip" id="qChip">？</div>
    `;

    const ch = document.getElementById("choices");
    ch.innerHTML = "";
    current.choiceArr.forEach(v=>{
      const p = PRINCESSES[v];
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.style.background = chipBg(v);
      btn.innerHTML = `
        <svg class="princess-badge"><use href="#${p.icon}"></use></svg>
        <span>${v}</span>
        <span class="label">${p.name}</span>
      `;
      btn.dataset.value = v;
      btn.addEventListener("click", ()=>onAnswer(v, btn));
      ch.appendChild(btn);
    });

    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").className = "feedback";
  }

  /* ---------- 回答処理 ---------- */
  function fillQChip(value){
    const qChip = document.getElementById("qChip");
    qChip.classList.remove("q-pop","q-correct","q-wrong","q-reveal");
    qChip.style.background = chipBg(value);
    qChip.innerHTML = `<span class="qdigit">${value}</span>`;
    // リフローさせてからクラス付与し、pop アニメーションを毎回再生する
    void qChip.offsetWidth;
    qChip.classList.add("q-pop");
    return qChip;
  }

  function onAnswer(value, btn){
    document.querySelectorAll(".choice-btn").forEach(b=>b.disabled = true);
    const mascot = document.getElementById("mascot");
    const fb = document.getElementById("feedback");
    const qChip = fillQChip(value);

    if(value === current.sum){
      btn.classList.add("correct-flash");
      qChip.classList.add("q-correct");
      fb.textContent = "せいかい！すごいね💖";
      fb.className = "feedback good";
      mascot.className = "mascot happy";
      playCorrect();
      launchConfetti();
      state.streak++;
      updateStreakGauge();
      saveState();

      if(state.streak >= 3){
        state.streak = 0;
        saveState();
        setTimeout(()=>{ updateStreakGauge(); awardItem(); }, 550);
      } else {
        setTimeout(nextProblem, 1100);
      }
    }else{
      btn.classList.add("wrong-flash");
      document.querySelectorAll(".choice-btn").forEach(b=>{
        if(parseInt(b.dataset.value) === current.sum) b.classList.add("correct-flash");
      });
      qChip.classList.add("q-wrong");
      fb.textContent = `おしい！こたえは ${current.sum} だよ。もういっかい！`;
      fb.className = "feedback bad";
      mascot.className = "mascot oops";
      playWrong();
      state.streak = 0;
      updateStreakGauge();
      saveState();

      setTimeout(()=>{
        qChip.classList.remove("q-wrong");
        qChip.style.background = chipBg(current.sum);
        qChip.innerHTML = `<span class="qdigit">${current.sum}</span>`;
        qChip.classList.add("q-reveal");
      }, 700);
      setTimeout(nextProblem, 1900);
    }
  }

  function nextProblem(){
    document.getElementById("mascot").className = "mascot";
    genProblem();
    renderProblem();
  }

  function updateStreakGauge(){
    const hearts = document.querySelectorAll("#streakGauge .heart");
    hearts.forEach((h,i)=>{
      h.classList.toggle("on", i < state.streak);
    });
  }

  /* ---------- ごほうび ---------- */
  function pickItem(){
    const counts = {};
    ITEMS.forEach(it=>counts[it.id]=0);
    state.collected.forEach(id=>counts[id] = (counts[id]||0)+1);
    const uncollected = ITEMS.filter(it=>counts[it.id]===0);
    const pool = uncollected.length ? uncollected : ITEMS;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function awardItem(){
    const item = pickItem();
    state.collected.push(item.id);
    saveState();
    renderCollection();

    const back = document.getElementById("modalBack");
    const icon = document.getElementById("modalIcon");
    icon.innerHTML = itemIconInner(item);
    document.getElementById("modalName").textContent = item.name + " を てにいれた！";
    back.classList.add("show");
    playReward();
    launchConfetti(60);
  }

  document.getElementById("modalClose").addEventListener("click", ()=>{
    document.getElementById("modalBack").classList.remove("show");
    nextProblem();
  });

  /* ---------- きせかえ ---------- */
  function toggleEquip(itemId){
    const item = ITEMS.find(i=>i.id===itemId);
    if(!item) return;
    if(state.equipped[item.shape] === itemId){
      delete state.equipped[item.shape];
    }else{
      state.equipped[item.shape] = itemId;
    }
    saveState();
    renderAvatar();
    renderCollection();
  }

  function renderAvatar(){
    SHAPES.forEach(shape=>{
      const slot = document.querySelector(`.avatar-slot[data-shape="${shape.id}"]`);
      if(!slot) return;
      const itemId = state.equipped[shape.id];
      if(itemId){
        const item = ITEMS.find(i=>i.id===itemId);
        slot.innerHTML = item ? `<svg viewBox="0 0 100 100">${itemIconInner(item)}</svg>` : "";
        slot.classList.add("filled");
        slot.title = item ? item.name + "（タップではずす）" : "";
      }else{
        slot.innerHTML = "";
        slot.classList.remove("filled");
        slot.title = shape.name + "（からっぽ）";
      }
    });
  }

  document.querySelectorAll(".avatar-slot").forEach(slot=>{
    slot.addEventListener("click", ()=>{
      const shapeId = slot.dataset.shape;
      if(state.equipped[shapeId]){
        delete state.equipped[shapeId];
        saveState();
        renderAvatar();
        renderCollection();
      }
    });
  });

  function renderCollection(){
    const grid = document.getElementById("itemGrid");
    grid.innerHTML = "";
    const counts = {};
    const order = [];
    state.collected.forEach(id=>{
      if(!counts[id]) order.push(id);
      counts[id] = (counts[id]||0)+1;
    });

    if(order.length === 0){
      grid.innerHTML = `<div class="empty-hint">3もんれんぞく せいかいして、さいしょのアイテムを あつめよう！✨</div>`;
    }else{
      order.forEach(id=>{
        const it = ITEMS.find(x=>x.id===id);
        const isWorn = state.equipped[it.shape] === id;
        const slot = document.createElement("div");
        slot.className = "item-slot" + (isWorn ? " equipped" : "");
        slot.title = it.name + (isWorn ? "（そうちゅう・タップではずす）" : "（タップできせかえ）");
        slot.innerHTML = `<svg viewBox="0 0 100 100">${itemIconInner(it)}</svg>`;
        if(isWorn){
          const w = document.createElement("span");
          w.className = "wornmark";
          w.textContent = "✨";
          slot.appendChild(w);
        }
        if(counts[id] > 1){
          const b = document.createElement("span");
          b.className = "badge";
          b.textContent = "×" + counts[id];
          slot.appendChild(b);
        }
        slot.addEventListener("click", ()=>toggleEquip(id));
        grid.appendChild(slot);
      });
    }

    document.getElementById("collectCount").textContent =
      `${order.length}/${ITEMS.length}しゅるい はっけん！（あつめた かず：${state.collected.length}）`;
  }

  function renderLegend(){
    const grid = document.getElementById("legendGrid");
    grid.innerHTML = "";
    for(let n=1; n<=10; n++){
      const p = PRINCESSES[n];
      const item = document.createElement("div");
      item.className = "legend-item";
      item.style.background = chipBg(n);
      item.innerHTML = `
        <svg class="princess-badge"><use href="#${p.icon}"></use></svg>
        <div class="ldigit">${n}</div>
        <div class="lname">${p.name}</div>
      `;
      grid.appendChild(item);
    }
  }

  /* ---------- 紙吹雪演出 ---------- */
  function launchConfetti(n){
    n = n || 26;
    const colors = Object.values(NUM_COLORS).map(c=>c.hex).filter(h=>!h.startsWith("linear"));
    for(let i=0;i<n;i++){
      const p = document.createElement("div");
      p.className = "confetti-piece";
      const size = 6 + Math.random()*6;
      p.style.width = size+"px";
      p.style.height = (size*1.4)+"px";
      p.style.left = Math.random()*100 + "vw";
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration = (1.6 + Math.random()*1.4) + "s";
      p.style.animationDelay = (Math.random()*0.3) + "s";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 3200);
    }
  }

  /* ---------- サウンドボタン ---------- */
  const soundBtn = document.getElementById("soundBtn");
  function refreshSoundBtn(){
    soundBtn.textContent = state.muted ? "🔇" : "🔊";
  }
  soundBtn.addEventListener("click", ()=>{
    state.muted = !state.muted;
    saveState();
    refreshSoundBtn();
  });

  /* ---------- 初期化 ---------- */
  refreshSoundBtn();
  updateStreakGauge();
  renderAvatar();
  renderCollection();
  renderLegend();
  nextProblem();

})();
</script>
</body>
</html>
