<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>プリンセスたしざんランド</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Kiwi+Maru:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#ffd9ec;
    --bg2:#dcd2ff;
    --bg3:#c9ecff;
    --card:#fffaff;
    --ink:#7a4a76;
    --ink-soft:#a97ea3;
    --gold:#f4c14e;
    --pink-deep:#ff6fa5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:'Kiwi Maru','Baloo 2',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  body{
    background:
      radial-gradient(circle at 15% 20%, #fff 0%, transparent 2%),
      radial-gradient(circle at 80% 10%, #fff 0%, transparent 2%),
      radial-gradient(circle at 60% 70%, #fff 0%, transparent 2%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    min-height:100vh;
    position:relative;
  }

  /* ===== 背景のきらきら ===== */
  .sparkles{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;
  }
  .sparkles span{
    position:absolute;
    font-size:20px;
    opacity:.55;
    animation:float 9s linear infinite;
    filter:drop-shadow(0 0 4px #fff);
  }
  @keyframes float{
    0%{transform:translateY(110vh) rotate(0deg) scale(.7); opacity:0;}
    10%{opacity:.7;}
    90%{opacity:.6;}
    100%{transform:translateY(-10vh) rotate(360deg) scale(1.1); opacity:0;}
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:18px 14px 60px;
  }

  header{
    text-align:center;
    margin-bottom:10px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(20px,6.4vw,34px);
    margin:6px 0 2px;
    color:var(--pink-deep);
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 0 3px 8px rgba(255,111,165,.35);
    letter-spacing:.5px;
    word-break:keep-all;
    white-space:nowrap;
  }
  header .sub{
    font-size:14px;
    color:var(--ink-soft);
  }

  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:14px 0;
  }

  .mascot-box{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .mascot{
    font-size:46px;
    display:inline-block;
    animation:bob 2.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.15));
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-6px) rotate(2deg);}
  }
  .mascot.happy{animation:happyjump .5s ease;}
  @keyframes happyjump{
    0%{transform:translateY(0) scale(1);}
    30%{transform:translateY(-22px) scale(1.15) rotate(-8deg);}
    60%{transform:translateY(-4px) scale(1.05) rotate(6deg);}
    100%{transform:translateY(0) scale(1);}
  }
  .mascot.oops{animation:oopsshake .5s ease;}
  @keyframes oopsshake{
    0%,100%{transform:translateX(0) rotate(0);}
    25%{transform:translateX(-6px) rotate(-6deg);}
    75%{transform:translateX(6px) rotate(6deg);}
  }

  .streak-gauge{
    display:flex;
    gap:6px;
    background:#fff;
    padding:8px 12px;
    border-radius:20px;
    box-shadow:0 3px 0 #f0d9ea, 0 6px 14px rgba(150,90,150,.15);
  }
  .streak-gauge .heart{
    font-size:22px;
    opacity:.25;
    transition:transform .25s ease, opacity .25s ease;
  }
  .streak-gauge .heart.on{
    opacity:1;
    transform:scale(1.2);
  }

  .sound-btn{
    border:none;
    background:#fff;
    width:44px;height:44px;
    border-radius:50%;
    font-size:20px;
    box-shadow:0 3px 0 #f0d9ea, 0 6px 14px rgba(150,90,150,.15);
    cursor:pointer;
  }
  .switch-btn{
    border:none;
    background:#fff;
    width:36px;height:36px;
    border-radius:50%;
    font-size:16px;
    box-shadow:0 3px 0 #f0d9ea, 0 6px 14px rgba(150,90,150,.15);
    cursor:pointer;
  }

  /* ===== タイトル（プレイヤー選択）画面 ===== */
  .title-screen{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 15% 20%, #fff 0%, transparent 2%),
      radial-gradient(circle at 80% 10%, #fff 0%, transparent 2%),
      radial-gradient(circle at 60% 70%, #fff 0%, transparent 2%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  }
  .title-screen.hidden{display:none;}
  .title-card{
    background:#fffaff;
    border-radius:28px;
    padding:34px 20px;
    text-align:center;
    max-width:400px;
    width:100%;
    box-shadow:0 10px 0 #f0d3ea, 0 20px 40px rgba(150,90,150,.25);
  }
  .title-heading{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:24px;
    color:var(--pink-deep);
    margin:0 0 26px;
  }
  .player-picker{
    display:flex;
    gap:10px;
    justify-content:center;
  }
  .player-card{
    flex:1;
    min-width:0;
    border:none;
    border-radius:20px;
    padding:16px 6px;
    background:linear-gradient(160deg,#fff0f8,#f3e6fb);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    box-shadow:0 4px 0 #e8cfe0, 0 8px 16px rgba(150,90,150,.15);
    transition:transform .12s ease;
  }
  .player-card:active{transform:translateY(3px); box-shadow:0 1px 0 #e8cfe0;}
  .player-emoji{font-size:42px;}
  .player-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--ink);
  }

  /* なおやモードでは数字とプリンセスの対応図鑑は非表示 */
  body[data-player="naoya"] .legend,
  body[data-player="youta"] .legend{display:none;}
  /* きせかえの人形はプリンセス専用デザインのためマイクラ画面とは相性が悪く、陽太モードでは非表示にする */
  body[data-player="youta"] .dressup{display:none;}

  /* ===== なおやモード：自由入力の計算 ===== */
  .naoya-num{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(32px,8vw,44px);
    color:var(--pink-deep);
    background:#fff0f8;
    padding:10px 16px;
    border-radius:16px;
    box-shadow:0 3px 0 #f0d3ea;
  }
  .naoya-input-wrap{display:flex;}
  .naoya-input{
    width:130px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:36px;
    text-align:center;
    border:3px solid #e3b8d8;
    border-radius:16px;
    padding:8px 6px;
    color:var(--ink);
    background:#fff;
    outline:none;
  }
  .naoya-input:focus{border-color:var(--pink-deep);}
  .naoya-input.naoya-correct{border-color:#57c98a; background:#eafff2; animation:qCorrectPulse .6s ease;}
  .naoya-input.naoya-wrong{border-color:#ff6b7a; background:#fff0f0; animation:qShake .5s ease;}
  .naoya-input::-webkit-outer-spin-button,
  .naoya-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .naoya-input[type=number]{-moz-appearance:textfield;}
  .naoya-submit-btn{
    border:none;
    background:linear-gradient(135deg,#ff9ecb,#ff6fa5);
    color:#fff;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:20px;
    padding:14px 32px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 4px 0 #d9457e;
  }
  .naoya-submit-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d9457e;}
  .naoya-submit-btn:disabled{opacity:.6; cursor:default;}

  /* ===== 問題カード ===== */
  .problem-card{
    background:var(--card);
    border-radius:28px;
    padding:22px 16px 26px;
    box-shadow:0 6px 0 #f0d3ea, 0 14px 30px rgba(150,90,150,.2);
    position:relative;
    overflow:hidden;
  }
  .problem-card::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,220,240,.9), transparent 70%);
  }

  .equation{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .num-chip{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:10px 12px 12px;
    border-radius:20px;
    min-width:96px;
  }
  .princess-badge{
    width:48px;
    height:48px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));
  }
  .pname{
    font-family:'Kiwi Maru',sans-serif;
    font-size:11px;
    font-weight:500;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.2);
    white-space:nowrap;
  }
  .num-chip .digit{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:36px;
    line-height:1;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .num-chip .dots{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .num-chip .dot-row{
    display:flex;
    justify-content:center;
    gap:4px;
  }
  .num-chip .dots i{
    width:9px;height:9px;border-radius:50%;
    background:rgba(255,255,255,.85);
    display:inline-block;
    box-shadow:0 1px 1px rgba(0,0,0,.15) inset;
  }
  .op{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:34px;
    color:var(--ink-soft);
  }
  .q-chip{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:88px;
    min-height:96px;
    border-radius:20px;
    background:repeating-linear-gradient(135deg,#f6e3f6,#f6e3f6 10px,#f0d6f2 10px,#f0d6f2 20px);
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:44px;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
    transition:background .2s ease;
  }
  .q-chip .qdigit{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:44px;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .q-chip.q-pop{ animation:qPop .35s ease; }
  .q-chip.q-correct{ animation:qCorrectPulse .6s ease; box-shadow:0 0 0 5px #ffe066 inset; }
  .q-chip.q-wrong{ animation:qShake .5s ease; }
  .q-chip.q-reveal{ box-shadow:0 0 0 4px rgba(255,224,102,.9) inset; }
  @keyframes qPop{
    0%{transform:scale(.4); opacity:0;}
    65%{transform:scale(1.18); opacity:1;}
    100%{transform:scale(1);}
  }
  @keyframes qCorrectPulse{
    0%{transform:scale(1);}
    45%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }
  @keyframes qShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-7px);}
    75%{transform:translateX(7px);}
  }

  .choices{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .choice-btn{
    border:none;
    cursor:pointer;
    border-radius:22px;
    padding:10px 10px 12px;
    min-width:96px;
    min-height:130px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:34px;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.12);
    box-shadow:0 5px 0 rgba(0,0,0,.13), 0 10px 18px rgba(150,90,150,.18);
    transition:transform .12s ease;
  }
  .choice-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.13);}
  .choice-btn .label{
    font-family:'Kiwi Maru',sans-serif;
    font-size:12px;
    font-weight:500;
    color:rgba(255,255,255,.95);
  }
  .choice-btn.correct-flash{outline:5px solid #ffe066; animation:pulse .5s ease;}
  .choice-btn.wrong-flash{filter:grayscale(.4) brightness(.85);}
  @keyframes pulse{
    0%{transform:scale(1);}
    40%{transform:scale(1.12);}
    100%{transform:scale(1);}
  }

  .feedback{
    text-align:center;
    min-height:30px;
    margin-top:14px;
    font-size:18px;
    font-weight:500;
  }
  .feedback.good{color:#e0862a;}
  .feedback.bad{color:#ff6fa5;}

  /* ===== きせかえコーナー ===== */
  .dressup{
    margin-top:22px;
    background:#fff;
    border-radius:24px;
    padding:16px;
    box-shadow:0 5px 0 #f0d9ea, 0 10px 20px rgba(150,90,150,.15);
  }
  .dressup h2{
    margin:2px 0 12px;
    font-size:16px;
    text-align:center;
    color:var(--pink-deep);
  }
  .avatar-stage{
    position:relative;
    width:min(280px, 78vw);
    aspect-ratio:240/380;
    margin:0 auto;
    background:
      radial-gradient(ellipse at 50% 28%, rgba(255,255,255,.9), transparent 55%),
      linear-gradient(160deg, #fdeef8, #f3e6fb 55%, #eaf3ff);
    border-radius:20px;
    overflow:hidden;
  }
  .avatar-stage::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(2px 2px at 15% 15%, #fff, transparent),
      radial-gradient(2px 2px at 85% 20%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 75% 8%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 25% 85%, #fff, transparent),
      radial-gradient(2px 2px at 90% 70%, #fff, transparent);
    opacity:.8;
    pointer-events:none;
  }
  .avatar-doll{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .avatar-slot{
    position:absolute;
    width:15%;
    aspect-ratio:1;
    max-width:40px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:transparent;
    border:none;
    cursor:pointer;
    z-index:2;
  }
  .avatar-slot:active{transform:translate(-50%,-50%) scale(.94);}
  .worn-item{transition:opacity .2s ease;}
  .dressup-hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:12px;
  }

  /* ===== コレクション ===== */
  .collection{
    margin-top:22px;
    background:#fff;
    border-radius:24px;
    padding:16px;
    box-shadow:0 5px 0 #f0d9ea, 0 10px 20px rgba(150,90,150,.15);
  }
  .collection h2{
    margin:2px 0 10px;
    font-size:16px;
    text-align:center;
    color:var(--pink-deep);
  }
  .collection .count{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .item-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(64px,1fr));
    gap:10px;
  }
  .item-slot{
    position:relative;
    aspect-ratio:1;
    border-radius:16px;
    background:linear-gradient(160deg,#fbeaf7,#f2e3ff);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .item-slot{cursor:pointer;}
  .item-slot svg{width:70%;height:70%;}
  .item-slot.equipped{
    outline:3px solid #ffe066;
    outline-offset:-3px;
    background:linear-gradient(160deg,#fff3d9,#ffe9f5);
  }
  .item-slot .wornmark{
    position:absolute; top:2px; left:4px;
    font-size:11px;
  }
  .item-slot .badge{
    position:absolute; bottom:2px; right:4px;
    font-size:10px; background:var(--pink-deep); color:#fff;
    border-radius:8px; padding:0 5px; font-weight:700;
  }
  .empty-hint{
    grid-column:1/-1;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    padding:18px 10px;
  }

  /* ===== プリンセス図鑑 ===== */
  .legend{
    margin-top:16px;
    background:#fff;
    border-radius:24px;
    padding:16px;
    box-shadow:0 5px 0 #f0d9ea, 0 10px 20px rgba(150,90,150,.15);
  }
  .legend h2{
    margin:2px 0 12px;
    font-size:16px;
    text-align:center;
    color:var(--pink-deep);
  }
  .legend-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
    gap:10px;
  }
  .legend-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 4px;
    border-radius:16px;
  }
  .legend-item .princess-badge{
    width:38px;
    height:38px;
  }
  .legend-item .ldigit{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:18px;
    color:#fff;
    text-shadow:0 1px 0 rgba(0,0,0,.12);
  }
  .legend-item .lname{
    font-size:10px;
    font-weight:500;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.15);
    text-align:center;
    line-height:1.2;
  }

  /* ===== ごほうびモーダル ===== */
  .modal-back{
    position:fixed; inset:0; background:rgba(120,70,110,.45);
    display:flex; align-items:center; justify-content:center;
    z-index:20; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .modal-back.show{opacity:1; pointer-events:auto;}
  .modal{
    background:#fffaff;
    border-radius:28px;
    padding:26px 22px 22px;
    max-width:320px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(80,30,70,.35);
    transform:scale(.7);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-back.show .modal{transform:scale(1);}
  .modal h3{
    color:var(--pink-deep);
    font-size:20px;
    margin:4px 0 14px;
  }
  .modal .item-icon{
    width:120px;height:120px;
    margin:0 auto 12px;
    animation:spinin .6s ease;
  }
  @keyframes spinin{
    0%{transform:scale(.3) rotate(-30deg); opacity:0;}
    100%{transform:scale(1) rotate(0); opacity:1;}
  }
  .modal .item-name{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:16px;
  }
  .modal button{
    border:none;
    background:linear-gradient(135deg,#ff9ecb,#ff6fa5);
    color:#fff;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:12px 28px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 4px 0 #d9457e;
  }
  .modal button:active{transform:translateY(3px); box-shadow:0 1px 0 #d9457e;}

  /* 紙吹雪 */
  .confetti-piece{
    position:fixed;
    top:-10px;
    z-index:30;
    pointer-events:none;
    border-radius:2px;
    animation:fall 2.4s linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(540deg); opacity:.2;}
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:26px;
  }

  /* ================================================================
     陽太モード：完全マインクラフト風UI
     ================================================================ */
  body[data-player="youta"]{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 4px, transparent 4px 32px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 4px, transparent 4px 32px),
      linear-gradient(180deg, #7ec850 0%, #7ec850 7%, #8b5a2b 7%, #6b4423 100%);
  }
  body[data-player="youta"] .sparkles span{filter:none; text-shadow:none;}

  body[data-player="youta"] header,
  body[data-player="youta"] .problem-card,
  body[data-player="youta"] .dressup,
  body[data-player="youta"] .collection{
    background:#c6c6c6;
    border-radius:0;
    border:4px solid #1a1a1a;
    box-shadow:inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.5);
    padding:14px 12px;
  }
  body[data-player="youta"] header{margin-bottom:14px;}

      return shape.svg(material.hex);
    }
    const shape = SHAPES.find(s=>s.id===item.shape);
    const {fill, defs} = resolveFill(item);
    return defs + shape.svg(fill);

  /* ---------- 状態管理 ---------- */
  const SAVE_KEY = "princess-math-game-v1";
  let state = loadState();

  function loadState(){
    let s = null;
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(raw) s = JSON.parse(raw);
    }catch(e){}
    if(!s) s = {};
    if(!Array.isArray(s.collected)) s.collected = [];
    if(typeof s.streak !== "number") s.streak = 0;
    if(typeof s.muted !== "boolean") s.muted = false;
    if(!s.equipped || typeof s.equipped !== "object") s.equipped = {};
    if(s.player !== "anna" && s.player !== "naoya") s.player = null;
    return s;
  }
  function saveState(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
  }

  /* ---------- サウンド ---------- */
  let audioCtx = null;
  function beep(freqs, dur){
    if(state.muted) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      freqs.forEach((f,i)=>{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, now + i*0.12);
        gain.gain.linearRampToValueAtTime(0.18, now + i*0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.12 + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + i*0.12);
        osc.stop(now + i*0.12 + dur + 0.05);
      });
    }catch(e){}
  }
  function playCorrect(){ beep([523.25,659.25,783.99], 0.35); }
  function playWrong(){ beep([300,220], 0.3); }
  function playReward(){ beep([659.25,783.99,987.77,1174.66], 0.45); }

  /* ---------- 背景のきらきら生成 ---------- */
  function makeSparkles(){
    const el = document.getElementById("sparkles");
    el.innerHTML = "";
    const glyphs = state.player === "youta"
      ? ["⛏️","💎","🟩","🟫","⬛"]
      : ["✨","⭐","💗","🌸","👑"];
    for(let i=0;i<16;i++){
      const s = document.createElement("span");
      s.textContent = glyphs[i % glyphs.length];
      s.style.left = Math.random()*100 + "vw";
      s.style.animationDelay = (Math.random()*9) + "s";
      s.style.animationDuration = (7+Math.random()*6) + "s";

      el.appendChild(s);
    }
  }

  /* ---------- 問題生成 ---------- */
  let current = null;

  function maxAddendForLevel(){
    // コレクション（プリンセスの宝物のみ）が増えるほど少しずつ数字の範囲が広がる
    const princessCount = state.collected.filter(id=>{
      const it = ITEMS.find(x=>x.id===id);
      return it && it.pool === "princess";
    }).length;
    return Math.min(6, 2 + Math.floor(princessCount/2));
  }

  function genProblem(){
    if(state.player === "naoya"){
      let a,b,sum,opSymbol;
      if(Math.random() < 0.5){
        // 二桁の掛け算
        a = 10 + Math.floor(Math.random()*90);
        b = 2 + Math.floor(Math.random()*8);
        sum = a*b;
        opSymbol = "×";
      }else{
        // 三桁の足し算
        a = 100 + Math.floor(Math.random()*900);
        b = 100 + Math.floor(Math.random()*900);
        sum = a+b;
        opSymbol = "＋";
      }
      current = {terms:[a,b], sum, opSymbol, mode:"free"};
      return;
    }

    if(state.player === "youta"){
      // 暗算2級レベル：3口のたし算／3桁×2桁の掛け算／わり切れる2〜3桁のわり算
      const type = ["add3","mul","div"][Math.floor(Math.random()*3)];
      let terms, sum, opSymbol;
      if(type === "add3"){
        terms = [
          100 + Math.floor(Math.random()*900),
          100 + Math.floor(Math.random()*900),
          100 + Math.floor(Math.random()*900)
        ];
        sum = terms[0] + terms[1] + terms[2];
        opSymbol = "＋";
      }else if(type === "mul"){
        const a = 100 + Math.floor(Math.random()*900);
        const b = 10 + Math.floor(Math.random()*90);
        terms = [a,b];
        sum = a*b;
        opSymbol = "×";
      }else{
        const divisor = 10 + Math.floor(Math.random()*90);
        const quotient = 10 + Math.floor(Math.random()*90);
        terms = [divisor*quotient, divisor];
        sum = quotient;
        opSymbol = "÷";
      }
      current = {terms, sum, opSymbol, mode:"free"};
      return;
    }

    const maxA = maxAddendForLevel();
    let a,b,sum;
    do{
      a = 1 + Math.floor(Math.random()*maxA);
      b = 1 + Math.floor(Math.random()*maxA);
      sum = a+b;
    }while(sum>10);

    const choices = new Set([sum]);
    while(choices.size < 3){
      const delta = [-2,-1,1,2][Math.floor(Math.random()*4)];
      const cand = sum + delta;
      if(cand>=1 && cand<=10) choices.add(cand);
    }
    const choiceArr = shuffle(Array.from(choices));
    current = {a,b,sum,choiceArr,mode:"anna"};
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function dotsHtml(n){
    let h = "";
    for(let i=0; i<n; i+=5){
      const count = Math.min(5, n-i);
      h += `<div class="dot-row">${"<i></i>".repeat(count)}</div>`;
    }
    return h;
  }

  function numChipHtml(n){
    const p = PRINCESSES[n];
    return `
      <div class="num-chip" style="background:${chipBg(n)}">
        <svg class="princess-badge"><use href="#${p.icon}"></use></svg>
        <div class="digit">${n}</div>
        <div class="dots">${dotsHtml(n)}</div>
        <div class="pname">${p.name}</div>
      </div>
    `;
  }

  function renderProblem(){
    const eq = document.getElementById("equation");
    const ch = document.getElementById("choices");
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").className = "feedback";

    if(current.mode === "free"){
      const {terms,opSymbol} = current;
      const termsHtml = terms
        .map(t=>`<div class="naoya-num">${t}</div>`)
        .join(`<div class="op">${opSymbol}</div>`);
      eq.innerHTML = `
        ${termsHtml}
        <div class="op">＝</div>
        <div class="naoya-input-wrap">
          <input type="number" inputmode="numeric" id="naoyaInput" class="naoya-input" placeholder="？" autocomplete="off">
        </div>
      `;
      ch.innerHTML = `<button class="naoya-submit-btn" id="naoyaSubmit">こたえる ➜</button>`;
      const input = document.getElementById("naoyaInput");
      document.getElementById("naoyaSubmit").addEventListener("click", onNaoyaSubmit);
      input.addEventListener("keydown", e=>{ if(e.key === "Enter") onNaoyaSubmit(); });
      setTimeout(()=>input.focus(), 50);
      return;
    }

    const {a,b} = current;
    eq.innerHTML = `
      ${numChipHtml(a)}
      <div class="op">＋</div>
      ${numChipHtml(b)}
      <div class="op">＝</div>
      <div class="q-chip" id="qChip">？</div>
    `;

    ch.innerHTML = "";
    current.choiceArr.forEach(v=>{
      const p = PRINCESSES[v];
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.style.background = chipBg(v);
      btn.innerHTML = `
        <svg class="princess-badge"><use href="#${p.icon}"></use></svg>
        <span>${v}</span>
        <span class="label">${p.name}</span>
      `;
      btn.dataset.value = v;
      btn.addEventListener("click", ()=>onAnswer(v, btn));
      ch.appendChild(btn);
    });
  }

  /* ---------- 回答処理（共通のせいかい/おしい処理） ---------- */
  function markCorrect(){
    const mascot = document.getElementById("mascot");
    mascot.className = "mascot happy";
    playCorrect();
    launchConfetti();
    state.streak++;
    updateStreakGauge();
    saveState();

    if(state.streak >= 3){
      state.streak = 0;
      saveState();
      setTimeout(()=>{ updateStreakGauge(); awardItem(); }, 550);
      return true;
    }
    return false;
  }

  function markWrong(){
    const mascot = document.getElementById("mascot");
    mascot.className = "mascot oops";
    playWrong();
    state.streak = 0;
    updateStreakGauge();
    saveState();
  }

  function fillQChip(value){
    const qChip = document.getElementById("qChip");
    qChip.classList.remove("q-pop","q-correct","q-wrong","q-reveal");
    qChip.style.background = chipBg(value);
    qChip.innerHTML = `<span class="qdigit">${value}</span>`;
    // リフローさせてからクラス付与し、pop アニメーションを毎回再生する
    void qChip.offsetWidth;
    qChip.classList.add("q-pop");
    return qChip;
  }

  function onAnswer(value, btn){
    document.querySelectorAll(".choice-btn").forEach(b=>b.disabled = true);
    const fb = document.getElementById("feedback");
    const qChip = fillQChip(value);

    if(value === current.sum){
      btn.classList.add("correct-flash");
      qChip.classList.add("q-correct");
      fb.textContent = "せいかい！すごいね💖";
      fb.className = "feedback good";
      const rewarded = markCorrect();
      if(!rewarded) setTimeout(nextProblem, 1100);
    }else{
      btn.classList.add("wrong-flash");
      document.querySelectorAll(".choice-btn").forEach(b=>{
        if(parseInt(b.dataset.value) === current.sum) b.classList.add("correct-flash");
      });
      qChip.classList.add("q-wrong");
      fb.textContent = `おしい！こたえは ${current.sum} だよ。もういっかい！`;
      fb.className = "feedback bad";
      markWrong();

      setTimeout(()=>{
        qChip.classList.remove("q-wrong");
        qChip.style.background = chipBg(current.sum);
        qChip.innerHTML = `<span class="qdigit">${current.sum}</span>`;
        qChip.classList.add("q-reveal");
      }, 700);
      setTimeout(nextProblem, 1900);
    }
  }

  function onNaoyaSubmit(){
    const input = document.getElementById("naoyaInput");
    const submitBtn = document.getElementById("naoyaSubmit");
    if(!input || input.value.trim() === "") return;
    const value = parseInt(input.value, 10);
    const fb = document.getElementById("feedback");
    input.disabled = true;
    submitBtn.disabled = true;

    if(value === current.sum){
      input.classList.add("naoya-correct");
      fb.textContent = "せいかい！すごい！💯";
      fb.className = "feedback good";
      const rewarded = markCorrect();
      if(!rewarded) setTimeout(nextProblem, 1300);
    }else{
      input.classList.add("naoya-wrong");
      fb.textContent = `おしい！こたえは ${current.sum} だよ。もういっかい！`;
      fb.className = "feedback bad";
      markWrong();
      setTimeout(nextProblem, 1900);
    }
  }

  function nextProblem(){
    document.getElementById("mascot").className = "mascot";
    genProblem();
    renderProblem();
  }

  function updateStreakGauge(){
    const hearts = document.querySelectorAll("#streakGauge .heart");
    hearts.forEach((h,i)=>{
      h.classList.toggle("on", i < state.streak);
    });
  }

  /* ---------- ごほうび ---------- */
  function pickItem(){
    const poolItems = ITEMS.filter(it=>it.pool === currentPool());
    const counts = {};
    poolItems.forEach(it=>counts[it.id]=0);
    state.collected.forEach(id=>{ if(id in counts) counts[id]++; });
    const uncollected = poolItems.filter(it=>counts[it.id]===0);
    const pickPool = uncollected.length ? uncollected : poolItems;
    return pickPool[Math.floor(Math.random()*pickPool.length)];
  }

  function awardItem(){
    const item = pickItem();
    state.collected.push(item.id);
    saveState();
    renderCollection();

    const back = document.getElementById("modalBack");
    const icon = document.getElementById("modalIcon");
    icon.innerHTML = itemIconInner(item);
    document.getElementById("modalName").textContent = item.name + " を てにいれた！";
    back.classList.add("show");
    playReward();
    launchConfetti(60);
  }

  document.getElementById("modalClose").addEventListener("click", ()=>{
    document.getElementById("modalBack").classList.remove("show");
    nextProblem();
  });

  /* ---------- きせかえ ---------- */
  function toggleEquip(itemId){
    const item = ITEMS.find(i=>i.id===itemId);
    if(!item) return;
    if(state.equipped[item.shape] === itemId){
      delete state.equipped[item.shape];
    }else{
      state.equipped[item.shape] = itemId;
    }
    saveState();
    renderAvatar();
    renderCollection();
  }

  function renderAvatar(){
    SHAPES.forEach(shape=>{
      const g = document.getElementById(`worn-${shape.id}`);
      if(!g) return;
      const itemId = state.equipped[shape.id];
      const item = itemId ? ITEMS.find(i=>i.id===itemId) : null;
      g.innerHTML = item ? wornMarkup(item) : "";
    });
    const defaultShoes = document.getElementById("worn-shoes-default");
    if(defaultShoes) defaultShoes.style.display = state.equipped.shoes ? "none" : "";
  }

  document.querySelectorAll(".avatar-slot").forEach(slot=>{
    slot.addEventListener("click", ()=>{
      const shapeId = slot.dataset.shape;
      if(state.equipped[shapeId]){
        delete state.equipped[shapeId];
        saveState();
        renderAvatar();
        renderCollection();
      }
    });
  });

  function renderCollection(){
    const grid = document.getElementById("itemGrid");
    grid.innerHTML = "";
    const pool = currentPool();
    const poolTotal = ITEMS.filter(it=>it.pool === pool).length;
    const counts = {};
    const order = [];
    let poolCollectedCount = 0;
    state.collected.forEach(id=>{
      const it = ITEMS.find(x=>x.id===id);
      if(!it || it.pool !== pool) return;
      poolCollectedCount++;
      if(!counts[id]) order.push(id);
      counts[id] = (counts[id]||0)+1;
    });

    if(order.length === 0){
      grid.innerHTML = pool === "minecraft"
        ? `<div class="empty-hint">3もんれんぞく せいかいして、さいしょのブロックを ほりだそう！⛏️</div>`
        : `<div class="empty-hint">3もんれんぞく せいかいして、さいしょのアイテムを あつめよう！✨</div>`;
    }else{
      order.forEach(id=>{
        const it = ITEMS.find(x=>x.id===id);
        const isWorn = pool === "princess" && state.equipped[it.shape] === id;
        const slot = document.createElement("div");
        slot.className = "item-slot" + (isWorn ? " equipped" : "");
        slot.title = it.name + (isWorn ? "（そうちゅう・タップではずす）" : pool === "princess" ? "（タップできせかえ）" : "");
        slot.innerHTML = `<svg viewBox="0 0 100 100">${itemIconInner(it)}</svg>`;
        if(isWorn){
          const w = document.createElement("span");
          w.className = "wornmark";
          w.textContent = "✨";
          slot.appendChild(w);
        }
        if(counts[id] > 1){
          const b = document.createElement("span");
          b.className = "badge";
          b.textContent = "×" + counts[id];
          slot.appendChild(b);
        }
        if(pool === "princess") slot.addEventListener("click", ()=>toggleEquip(id));
        grid.appendChild(slot);
      });
    }

    document.getElementById("collectCount").textContent =
      `${order.length}/${poolTotal}しゅるい はっけん！（あつめた かず：${poolCollectedCount}）`;
  }

  function renderLegend(){
    const grid = document.getElementById("legendGrid");
    grid.innerHTML = "";
    for(let n=1; n<=10; n++){
      const p = PRINCESSES[n];
      const item = document.createElement("div");
      item.className = "legend-item";
      item.style.background = chipBg(n);
      item.innerHTML = `
        <svg class="princess-badge"><use href="#${p.icon}"></use></svg>
        <div class="ldigit">${n}</div>
        <div class="lname">${p.name}</div>
      `;
      grid.appendChild(item);
    }
  }

  /* ---------- 紙吹雪演出 ---------- */
  function launchConfetti(n){
    n = n || 26;
    const colors = state.player === "youta"
      ? ["#4a9e3c","#8b5a2b","#8b8b8b","#e8b923","#4ec9dd","#171717"]
      : Object.values(NUM_COLORS).map(c=>c.hex).filter(h=>!h.startsWith("linear"));
    for(let i=0;i<n;i++){
      const p = document.createElement("div");
      p.className = "confetti-piece";
      const size = 6 + Math.random()*6;
      p.style.width = size+"px";
      p.style.height = (size*1.4)+"px";
      p.style.left = Math.random()*100 + "vw";
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      if(state.player === "youta") p.style.borderRadius = "0";
      p.style.animationDuration = (1.6 + Math.random()*1.4) + "s";
      p.style.animationDelay = (Math.random()*0.3) + "s";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 3200);
    }
  }

  /* ---------- サウンドボタン ---------- */
  const soundBtn = document.getElementById("soundBtn");
  function refreshSoundBtn(){
    soundBtn.textContent = state.muted ? "🔇" : "🔊";
  }
  soundBtn.addEventListener("click", ()=>{
    state.muted = !state.muted;
    saveState();
    refreshSoundBtn();
  });

  /* ---------- プレイヤー選択 ---------- */
  const CREEPER_ROWS = [
    [1,2,5,6],
    [1,2,5,6],
    [2,3,4,5],
    [2,3,4,5],
    [3,4],
    [2,3,4,5],
    [1,2,5,6],
    [0,1,6,7]
  ];
  function creeperSvg(){
    let rects = '<rect width="8" height="8" fill="#4a9e3c"/>';
    CREEPER_ROWS.forEach((cols,row)=>{
      cols.forEach(col=>{
        rects += `<rect x="${col}" y="${row}" width="1" height="1" fill="#171717"/>`;
      });
    });
    return `<svg viewBox="0 0 8 8" width="100%" height="100%" shape-rendering="crispEdges">${rects}</svg>`;
  }

  const PLAYER_CONFIG = {
    anna: {
      title: "👑 プリンセスたしざんランド 👑",
      sub: "かずをたしてドレスアップ・アイテムをあつめよう！",
      mascot: "👸"
    },
    naoya: {
      title: "🧮 なおやさんすうチャレンジ 🧮",
      sub: "かけ算・たし算にちょうせんしてアイテムをあつめよう！",
      mascot: "🤴"
    },
    youta: {
      title: "⛏️ マイクラさんすうワールド ⛏️",
      sub: "けいさんにちょうせんしてブロックをあつめよう！",
      mascot: null
    }
  };

  function applyPlayerTheme(player){
    const cfg = PLAYER_CONFIG[player];
    document.getElementById("mainTitle").textContent = cfg.title;
    document.getElementById("mainSub").textContent = cfg.sub;
    const mascotEl = document.getElementById("mascot");
    if(player === "youta"){
      mascotEl.innerHTML = creeperSvg();
    }else{
      mascotEl.textContent = cfg.mascot;
    }
    mascotEl.classList.toggle("mascot-pixel", player === "youta");
    document.body.dataset.player = player;
    document.getElementById("collectionTitle").textContent =
      player === "youta" ? "⛏️ たからばこ ⛏️" : "✨ プリンセスの宝箱 ✨";
    makeSparkles();
    renderCollection();
  }

  function startGame(player){
    state.player = player;
    saveState();
    applyPlayerTheme(player);
    document.getElementById("titleScreen").classList.add("hidden");
    document.getElementById("mainWrap").style.display = "";
    renderAvatar();
    renderCollection();
    renderLegend();
    nextProblem();
  }

  document.querySelectorAll(".player-card").forEach(btn=>{
    btn.addEventListener("click", ()=> startGame(btn.dataset.player));
  });

  document.getElementById("switchPlayerBtn").addEventListener("click", ()=>{
    document.getElementById("titleScreen").classList.remove("hidden");
    document.getElementById("mainWrap").style.display = "none";
  });

  /* ---------- 初期化 ---------- */
  refreshSoundBtn();
  updateStreakGauge();
  if(state.player){
    document.getElementById("mainWrap").style.display = "";
    document.getElementById("titleScreen").classList.add("hidden");
    applyPlayerTheme(state.player);
    renderAvatar();
    renderCollection();
    renderLegend();
    nextProblem();
  }else{
    document.getElementById("mainWrap").style.display = "none";
  }

})();
</script>
</body>
</html>
